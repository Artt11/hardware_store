version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (Relational persistence: Products, Users, Carts, Wishlists)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: auratools_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hardware_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Elasticsearch 8.x (Typo-tolerant autocomplete, fuzzy & faceted search)
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: auratools_elasticsearch
    environment:
      - node.name=auratools-node1
      - cluster.name=auratools-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || grep -q yellow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 (Cart sessions, rate limiting, and fast cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auratools_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI / Python 3)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auratools_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/hardware_store
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  esdata:
  redisdata:
