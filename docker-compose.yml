# Suro/Lavna storefront: PostgreSQL 16 + FastAPI + nginx (SPA and same-origin /api proxy).
#
#   cp .env.example .env            # fill in secrets
#   docker compose up -d --build    # http://localhost:8080
#   docker compose --profile seed run --rm seed    # import the Excel catalog (once / on update)
#
# Only the web entrypoint is published. TLS terminates in front of `web` in
# production (ENVIRONMENT=production requires https origins and Secure cookies).

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-hardware_store}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
  TRUSTED_PROXY_IPS: '["172.28.0.10"]'
  FORWARDED_ALLOW_IPS: 172.28.0.10

services:
  postgres:
    # Debian image: its en_US.utf8 locale lets pg_trgm and ILIKE handle Armenian
    # (the C locale used by Alpine images does not).
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-hardware_store}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.utf8
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c random_page_cost=1.1
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }
    networks:
      internal:
        ipv4_address: 172.28.0.10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  seed:
    profiles: [seed]
    build: ./backend
    command: ["python", "-m", "app.seed.run", "--images-dir", "/tmp/product-images"]
    environment:
      <<: *backend-env
      SEED_DEFAULT_STOCK: ${SEED_DEFAULT_STOCK:-100}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
